<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aprender Francés</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado con selector de tema y botón IPA fija arriba a la derecha -->
  <header class="app-header">
    <div class="header-left">
      <h1>🇫🇷 App Francés</h1>
      <select id="select-tema" onchange="onTemaChange()">
        <!-- Cargado dinámicamente -->
      </select>
    </div>
    <div class="header-right">
      <button class="btn-ipa" onclick="toggleIpaModal()">🗣️ Pronunciación IPA</button>
    </div>
  </header>

  <!-- Pestañas del Tema -->
  <nav class="sub-tabs">
    <button class="tab-link active" onclick="switchSubTab('ejercicios')">🎴 Ejercicios</button>
    <button class="tab-link" onclick="switchSubTab('texto')">✍️ Texto con Huecos</button>
    <button class="tab-link" onclick="switchSubTab('teoria')">📄 Teoría (PDF)</button>
  </nav>

  <!-- Contenedor Principal -->
  <main class="content-container">

    <!-- SUBSECCIÓN 1: EJERCICIOS -->
    <section id="section-ejercicios" class="sub-section active">
      <div id="exercise-card" class="card">
        <div class="card-header">
          <span id="ex-counter">Ejercicio 0/0</span>
          <span id="ex-status" class="badge">Pendiente</span>
        </div>
        <p id="ex-prompt" class="prompt">Cargando...</p>

        <div class="input-group">
          <input type="text" id="ex-input" placeholder="Escribe en francés..." autocomplete="off">
          <button class="btn-primary" onclick="checkExerciseAnswer()">Comprobar</button>
        </div>

        <p id="ex-feedback" class="feedback"></p>

        <div class="card-controls">
          <button onclick="prevExercise()">← Anterior</button>
          <button onclick="markAsHard()" class="btn-warning">⭐ Difícil</button>
          <button onclick="nextExercise()">Siguiente →</button>
        </div>
      </div>

      <!-- Pestaña desplegable de Teoría abajo del todo (sin reinicio) -->
      <div class="collapsible-theory">
        <button class="btn-toggle-theory" onclick="toggleEmbeddedTheory()">
          📖 <span id="theory-toggle-label">Mostrar Teoría del Tema</span>
        </button>
        <div id="embedded-theory-container" class="embedded-theory hidden">
          <iframe id="embedded-pdf-viewer" src="" width="100%" height="450px"></iframe>
        </div>
      </div>
    </section>

    <!-- SUBSECCIÓN 2: TEXTO CON HUECOS -->
    <section id="section-texto" class="sub-section">
      <div class="texto-container card">
        <h3>Completa el texto en francés</h3>
        <p class="instructions">Haz clic en una palabra de la lista y luego en el hueco correspondiente para colocarla.</p>

        <div id="word-bank" class="word-bank"></div>
        <div id="text-passage" class="text-passage"></div>

        <div class="texto-actions">
          <button class="btn-primary" onclick="checkFillText()">Comprobar Texto</button>
          <button onclick="resetFillText()">Reiniciar</button>
        </div>
        <p id="texto-feedback" class="feedback"></p>
      </div>
    </section>

    <!-- SUBSECCIÓN 3: TEORÍA (Vista Completa) -->
    <section id="section-teoria" class="sub-section">
      <div class="pdf-container card">
        <iframe id="main-pdf-viewer" src="" width="100%" height="600px"></iframe>
      </div>
    </section>

  </main>

  <!-- MODAL DE PRONUNCIACIÓN IPA -->
  <div id="ipa-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Pronunciación Fonética Francesa (IPA)</h2>
        <button class="btn-close" onclick="toggleIpaModal()">✕</button>
      </div>
      <div class="modal-body">
        <div id="ipa-grid" class="ipa-grid"></div>
      </div>
    </div>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
